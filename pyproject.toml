[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-memory-safety-lab"
version = "0.1.0"
description = "Audit proposed AI agent memories for sensitive data, redaction needs, and skill-distillation readiness."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Kartik Mishra" }]
license = { text = "MIT" }
keywords = ["agent-memory", "ai-safety", "redaction", "skills", "llm-evaluation", "python"]

[project.scripts]
memory-safety-lab = "memory_safety_lab.cli:main"
